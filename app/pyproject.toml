[tool.ruff]
line-length = 130
target-version = "py314"

[tool.ruff.lint]
# errors, unused code, import order, likely bugs, security (SQL built from text!), outdated syntax
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"] # asserts, test passwords, subprocesses
"tests/break_it.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["error"]
