# App server: the collector next to the app (the app itself is started by the deploy script).
# Host network: Alloy reaches the app on the server's localhost, where the app listens.
services:
  alloy:
    image: ${images.alloy}
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345 # its own status page, this server only
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    network_mode: host
    pid: host
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      # Read-only views of the server, for CPU, memory, disk and network figures
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    mem_limit: 200m
    restart: unless-stopped

volumes:
  alloy-data:
