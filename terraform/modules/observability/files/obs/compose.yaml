# Monitoring server. Memory limits keep the containers inside the server's 2 GB
# (Loki and the database exporters join them later). Images are pinned by digest.
services:
  prometheus:
    image: ${images.prometheus}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=12GB
      - --web.enable-remote-write-receiver # Alloy
      - --web.enable-otlp-receiver # k6 (OpenTelemetry metrics)
    ports:
      - "${prometheus_port}:9090" # the only open port; the security group allows the app server only
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 700m
    restart: unless-stopped

  grafana:
    image: ${images.grafana}
    depends_on: [prometheus]
    ports:
      - "127.0.0.1:${grafana_port}:3000" # this server only: reached through the SSM tunnel
    environment:
      # The tunnel is the door (operator role, company address); Grafana's own login would add a second password
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 350m
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
