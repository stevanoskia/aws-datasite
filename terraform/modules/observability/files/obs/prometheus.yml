# The app server pushes its metrics here (remote write from Alloy and k6), so Prometheus
# needs no route to it. Prometheus scrapes only itself; the database exporters follow.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          host: obs
