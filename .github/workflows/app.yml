# Tests the app against a real PostgreSQL 18 with the real migrations. No AWS access; nothing is deployed.

name: app

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "db/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app
  cancel-in-progress: true

jobs:
  test:
    name: test (lint, without and with database)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42 # 18.6
        env:
          POSTGRES_PASSWORD: throwaway # exists only inside this job
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: throwaway
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install the pinned libraries
        run: python -m pip install -q --disable-pip-version-check --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Tests
        run: python -m pytest tests

      - name: Check that the tests notice mistakes
        if: github.event_name == 'workflow_dispatch'
        run: python tests/break_it.py
