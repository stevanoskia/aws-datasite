# The app's pipeline: test → build → (migrate, only after an approval) → deploy.
#
# - test:    lint and all tests against a real PostgreSQL 18 with the real migrations. No AWS access.
# - build:   the app image and the migration image for the ARM server, pushed to the registry (tag = commit).
# - migrate: only when this push changes db/migrations (or by hand): waits for an approval in "production",
#            takes a snapshot of the database, then runs the migrations on the app server.
# - deploy:  the deploy workflow: the server checks the database, starts the version, tests it, else rolls back.
# Each job runs only if the one before it passed. Only fixed fields reach this public log (ADR-0008).

name: app

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "db/**"
      - "scripts/ci_*"
      - "scripts/safe_log.py"
      - ".github/workflows/app.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      migrate:
        description: "Run the migrations before the deploy (after an approval)"
        type: boolean
        default: false
      mistakes:
        description: "Also check that the tests notice deliberate mistakes (takes minutes)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: app
  cancel-in-progress: false # a deploy or a migration must never be stopped halfway

env:
  AWS_REGION: eu-north-1

jobs:
  test:
    name: test (lint, without and with database)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42 # 18.6
        env:
          POSTGRES_PASSWORD: throwaway # exists only inside this job
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: throwaway
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install the pinned libraries
        run: python -m pip install -q --disable-pip-version-check --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Tests
        run: python -m pytest tests

      - name: Check that the tests notice mistakes
        if: inputs.mistakes
        run: python tests/break_it.py

  build:
    name: build (ARM images → registry)
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm # the app server is ARM: built natively, no emulation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: AWS credentials (ci-deploy role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_DEPLOY_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-build-${{ github.run_id }}
          role-duration-seconds: 3600
          mask-aws-account-id: true

      - name: Build and push the app and migration images
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          OPERATOR_ALLOWED_CIDRS: ${{ secrets.OPERATOR_ALLOWED_CIDRS }}
        run: |
          set -euo pipefail
          source scripts/ci_private_values.sh
          registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry" 2>&1 | python3 scripts/safe_log.py
          for target in app migrate; do
            tag="$GITHUB_SHA"
            if [ "$target" = migrate ]; then tag="migrate-$GITHUB_SHA"; fi
            # Tags can't be replaced: a version that exists is not built again
            if aws ecr describe-images --repository-name aws-datasite/app --image-ids "imageTag=$tag" > /dev/null 2>&1; then
              echo "$target image exists already"
              continue
            fi
            docker buildx build --file app/Dockerfile --target "$target" --platform linux/arm64 --provenance=false \
              --tag "$registry/aws-datasite/app:$tag" --push . 2>&1 | python3 scripts/safe_log.py
            echo "### $target image built" >> "$GITHUB_STEP_SUMMARY"
          done

  changes:
    name: are there new migrations?
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      migrate: ${{ steps.check.outputs.migrate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: check
        env:
          BEFORE: ${{ github.event.before }}
          BY_HAND: ${{ inputs.migrate }}
        run: |
          set -euo pipefail
          if [ "$BY_HAND" = "true" ]; then
            migrate=true
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
            migrate="$( [ -n "$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- db/migrations)" ] && echo true || echo false )"
          else
            migrate=true # unknown starting point: rather ask once too often
          fi
          echo "migrate=$migrate" >> "$GITHUB_OUTPUT"
          echo "### new migrations: $migrate" >> "$GITHUB_STEP_SUMMARY"

  migrate:
    name: migrate (needs approval)
    needs: [build, changes]
    if: needs.changes.outputs.migrate == 'true'
    runs-on: ubuntu-24.04
    environment: production # required reviewer; the apply keys are secrets of this environment only
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: AWS credentials (ci-apply role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_APPLY_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_APPLY_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          role-session-name: gha-migrate-${{ github.run_id }}
          role-duration-seconds: 3600
          mask-aws-account-id: true

      # A way back for changes that a forward fix can't undo, such as a dropped column
      - name: Snapshot of the database
        run: |
          set -euo pipefail
          snapshot="aws-datasite-db-before-${GITHUB_SHA::12}-$GITHUB_RUN_ID"
          aws rds create-db-snapshot --db-instance-identifier aws-datasite-db --db-snapshot-identifier "$snapshot" \
            --tags Key=purpose,Value=before-migration > /dev/null
          aws rds wait db-snapshot-available --db-snapshot-identifier "$snapshot"
          echo "### snapshot $snapshot" >> "$GITHUB_STEP_SUMMARY"
          # Keep the newest two of these snapshots: each one costs storage
          aws rds describe-db-snapshots --db-instance-identifier aws-datasite-db --snapshot-type manual \
            --query 'sort_by(DBSnapshots[?starts_with(DBSnapshotIdentifier, `aws-datasite-db-before-`)], &SnapshotCreateTime)[:-2].DBSnapshotIdentifier' \
            --output text | tr '\t' '\n' | while read -r old; do
              if [ -n "$old" ] && [ "$old" != None ]; then aws rds delete-db-snapshot --db-snapshot-identifier "$old" > /dev/null; echo "deleted $old"; fi
            done

      - name: Migrate on the app server
        run: |
          set -uo pipefail
          bash scripts/ci_send_command.sh datasite-migrate "$GITHUB_SHA"
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::the migration failed (exit code $code); a failed file leaves nothing behind. Nothing was deployed."
            exit 1
          fi
          echo "### migrated" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [build, migrate]
    if: always() && needs.build.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ github.sha }}
    secrets: inherit
